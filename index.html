<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AvaX Pro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 100%);
    color: #e0e1dd; margin: 0; padding: 0; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header { text-align: center; padding: 14px 12px 8px; background: #0d1b2a; border-bottom: 2px solid #ff7b00; }
  header h1 { margin: 0; font-size: 19px; color: #ff7b00; letter-spacing: 1px; }
  header p { margin: 3px 0 0; font-size: 11px; color: #a0a0a0; }

  nav { display: flex; background: #1b263b; border-bottom: 1px solid #2a3b55; }
  nav button {
    flex: 1; padding: 12px 4px; background: transparent; border: none;
    color: #a0a0a0; font-size: 12px; font-weight: 600; cursor: pointer;
    border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  nav button.active { color: #ff7b00; border-bottom-color: #ff7b00; background: #0d1b2a; }

  main { flex: 1; padding: 12px; max-width: 600px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
  .tab { display: none; flex: 1; flex-direction: column; }
  .tab.active { display: flex; }

  #messages { flex: 1; overflow-y: auto; margin-bottom: 10px; padding: 4px; min-height: 200px; }
  .msg { padding: 10px 14px; border-radius: 14px; margin: 6px 0; max-width: 85%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .user { background: #ff7b00; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: #2a3b55; color: #e0e1dd; border-bottom-left-radius: 4px; }
  .bot.typing { color: #ff7b00; font-style: italic; }

  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1; padding: 12px; border: 1px solid #2a3b55; border-radius: 12px;
    font-size: 16px; background: #0d1b2a; color: #e0e1dd; outline: none;
  }
  .row input:focus { border-color: #ff7b00; }
  .btn-send { padding: 12px 18px; border: none; background: #ff7b00; color: #fff; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .btn-mic { padding: 12px 15px; border: none; background: #2a3b55; color: #fff; border-radius: 12px; font-size: 18px; cursor: pointer; }
  .btn-mic.listening { background: #e74c3c; animation: pulse 1s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  #suggestInput { width: 100%; padding: 14px; border: 1px solid #2a3b55; border-radius: 12px; font-size: 16px; background: #0d1b2a; color: #e0e1dd; outline: none; margin-bottom: 12px; }
  #suggestList { list-style: none; padding: 0; margin: 0; }
  #suggestList li { padding: 12px 14px; background: #1b263b; border-left: 3px solid #ff7b00; border-radius: 8px; margin-bottom: 8px; font-size: 15px; }
  #suggestList li strong { color: #ff7b00; }
  .hint { font-size: 13px; color: #7a8a9a; text-align: center; padding: 8px; }

  .game-box { text-align: center; }
  .choices { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .choices button { flex: 1; padding: 20px 8px; font-size: 32px; background: #1b263b; border: 2px solid #2a3b55; border-radius: 14px; cursor: pointer; }
  .result { padding: 14px; background: #1b263b; border-radius: 12px; margin-bottom: 12px; font-size: 16px; min-height: 50px; display: flex; align-items: center; justify-content: center; }
  .result.win { border: 2px solid #2ecc71; color: #2ecc71; }
  .result.lose { border: 2px solid #e74c3c; color: #e74c3c; }
  .result.draw { border: 2px solid #f1c40f; color: #f1c40f; }
  .score { display: flex; justify-content: space-around; padding: 12px; background: #0d1b2a; border-radius: 12px; font-size: 14px; }
  .score div span { display: block; font-size: 22px; font-weight: bold; color: #ff7b00; margin-top: 4px; }

  .settings-box { padding: 8px; }
  .settings-box h3 { color: #ff7b00; margin: 4px 0 12px; font-size: 16px; }
  .settings-box p { font-size: 13px; color: #a0a0a0; line-height: 1.5; }
  .settings-box a { color: #ff7b00; }
  .api-input { width: 100%; padding: 12px; border: 1px solid #2a3b55; border-radius: 10px; font-size: 14px; background: #0d1b2a; color: #e0e1dd; outline: none; margin-bottom: 10px; font-family: monospace; }
  .btn-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-row button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
  .btn-save { background: #ff7b00; color: #fff; }
  .btn-del { background: #2a3b55; color: #e0e1dd; }
  .status { padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; margin-bottom: 14px; }
  .status.ok { background: #143d23; color: #2ecc71; border: 1px solid #2ecc71; }
  .status.no { background: #3d1414; color: #e74c3c; border: 1px solid #e74c3c; }
</style>
</head>
<body>

<header>
  <h1>🚀 AVAX PRO</h1>
  <p>Akıllı Yapay Zeka Asistanı</p>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('sohbet', this)">💬 Sohbet</button>
  <button class="tab-btn" onclick="switchTab('oneri', this)">💡 Öneri</button>
  <button class="tab-btn" onclick="switchTab('oyun', this)">🎮 Oyun</button>
  <button class="tab-btn" onclick="switchTab('ayarlar', this)">⚙️ Ayarlar</button>
</nav>

<main>
  <!-- SOHBET -->
  <section id="sohbet" class="tab active">
    <div id="messages"></div>
    <div class="row">
      <button class="btn-mic" id="micBtn" onclick="startVoice()">🎤</button>
      <input id="chatInput" placeholder="Bir şey yaz..." autocomplete="off" />
      <button class="btn-send" onclick="send()">Gönder</button>
    </div>
  </section>

  <!-- ÖNERİ -->
  <section id="oneri" class="tab">
    <input id="suggestInput" placeholder="Bir kelime yaz (örn: kahve, spor)" oninput="suggest()" />
    <ul id="suggestList"></ul>
  </section>

  <!-- OYUN -->
  <section id="oyun" class="tab">
    <div class="game-box">
      <h3>Taş · Kağıt · Makas</h3>
      <div class="result" id="gameResult">Bir seçim yap!</div>
      <div class="choices">
        <button onclick="play('taş')">✊</button>
        <button onclick="play('kağıt')">✋</button>
        <button onclick="play('makas')">✌️</button>
      </div>
      <div class="score">
        <div>Sen <span id="scoreUser">0</span></div>
        <div>Berabere <span id="scoreDraw">0</span></div>
        <div>Bot <span id="scoreBot">0</span></div>
      </div>
    </div>
  </section>

  <!-- AYARLAR -->
  <section id="ayarlar" class="tab">
    <div class="settings-box">
      <h3>🔑 Gemini API Anahtarı</h3>
      <p>Kendi anahtarını gir. Sadece bu cihazda saklanır.</p>
      <div id="apiStatus" class="status no">❌ Anahtar yok</div>
      <input id="apiKeyInput" class="api-input" type="text" inputmode="text" placeholder="AIza..." autocomplete="off" spellcheck="false" />
      <div class="btn-row">
        <button class="btn-save" onclick="saveKey()">💾 Kaydet</button>
        <button class="btn-del" onclick="deleteKey()">🗑️ Sil</button>
      </div>
      <h3 style="margin-top:20px;">🗑️ Sohbeti Temizle</h3>
      <button class="btn-del" style="width:100%;" onclick="clearChat()">Tüm Geçmişi Sil</button>
    </div>
  </section>
</main>

<script>
// --- DEĞİŞKENLER & HAFIZA ---
const KEY_STORAGE = "avax_gemini_key";
const CHAT_STORAGE = "avax_chat_history";
let chatHistory = []; 

// --- SEKME ---
function switchTab(id, btn){
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
  if(id === "ayarlar") updateApiStatus();
}

// --- API AYARLARI ---
function getKey() { return localStorage.getItem(KEY_STORAGE) || ""; }
function updateApiStatus(){
  const el = document.getElementById("apiStatus");
  if(getKey()) { el.className = "status ok"; el.textContent = "✅ Anahtar bağlı (Gemini Aktif)"; }
  else { el.className = "status no"; el.textContent = "❌ Anahtar yok (Kural Modu)"; }
}
function saveKey(){
  const v = document.getElementById("apiKeyInput").value.trim();
  if(!v) return alert("Anahtar boş!");
  localStorage.setItem(KEY_STORAGE, v);
  document.getElementById("apiKeyInput").value = "";
  updateApiStatus();
  alert("✅ Anahtar kaydedildi!");
}
function deleteKey(){
  localStorage.removeItem(KEY_STORAGE);
  updateApiStatus();
  alert("🗑️ Anahtar silindi.");
}

// --- SOHBET HAFIZASI ---
function loadChat() {
  const saved = localStorage.getItem(CHAT_STORAGE);
  if (saved) {
    chatHistory = JSON.parse(saved);
    chatHistory.forEach(msg => renderMsg(msg.text, msg.role, false));
  } else {
    addMsg("Merhaba! Ben AvaX Pro. Size nasıl yardımcı olabilirim?", "bot");
  }
}
function saveChat() {
  localStorage.setItem(CHAT_STORAGE, JSON.stringify(chatHistory));
}
function clearChat() {
  if(confirm("Tüm sohbet geçmişi silinsin mi?")) {
    localStorage.removeItem(CHAT_STORAGE);
    chatHistory = [];
    document.getElementById("messages").innerHTML = "";
    addMsg("Hafıza sıfırlandı. Yeni bir sohbete hazırım!", "bot");
  }
}

// --- MESAJ EKRANA YAZDIRMA ---
function renderMsg(text, who, animate = true) {
  const div = document.createElement("div");
  div.className = "msg " + who + (who === 'bot' && text === '...' ? ' typing' : '');
  div.textContent = text;
  const box = document.getElementById("messages");
  box.appendChild(div);
  if(animate) box.scrollTop = box.scrollHeight;
  return div;
}
function addMsg(text, who, save = true) {
  if (save && text !== "...") {
    chatHistory.push({ role: who, text: text });
    saveChat();
  }
  return renderMsg(text, who);
}

// --- SESLİ GİRİŞ (Sadece Mikrofon) ---
function startVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    return alert("Bu tarayıcı mikrofonu desteklemiyor.");
  }
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = 'tr-TR';
  recognition.interimResults = false;
  
  const micBtn = document.getElementById("micBtn");
  micBtn.classList.add("listening");
  
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("chatInput").value = text;
    micBtn.classList.remove("listening");
    send(); // Direkt gönder
  };
  recognition.onerror = () => {
    micBtn.classList.remove("listening");
    alert("Ses algılanamadı, tekrar dene.");
  };
  recognition.onend = () => micBtn.classList.remove("listening");
  
  recognition.start();
}

// --- YAPAY ZEKA (AKILLI MODELLER) ---
const rules = [
  { keys:["selam","merhaba"], reply:"Selam! 👋 Sana nasıl yardımcı olabilirim?" },
  { keys:["saat"], reply:() => "Şu an: " + new Date().toLocaleTimeString("tr-TR") },
  { keys:["teşekkür"], reply:"Rica ederim! 😊" }
];
function getRuleReply(text){
  const t = text.toLowerCase();
  for(const r of rules){ if(r.keys.some(k => t.includes(k))) return typeof r.reply === "function" ? r.reply() : r.reply; }
  return null;
}

async function getGeminiReply(text){
  const key = getKey();
  if(!key) return null;
  
  // Akıllı modeller
  const models = ["gemini-2.5-flash", "gemini-3.5-flash", "gemini-3.6-flash", "gemini-1.5-pro-latest"];
  let lastError = "";

  // Sohbet geçmişini API formatına çevir (Son 10 mesaj)
  const contents = chatHistory.slice(-10).map(msg => ({
    role: msg.role === 'bot' ? 'model' : 'user',
    parts: [{ text: msg.text }]
  }));
  contents.push({ role: "user", parts: [{ text: text }] });

  for (const model of models) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: contents }) // System prompt kaldırıldı
      });
      
      if(res.ok) {
        const data = await res.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text;
      }
    } catch(e) { lastError = e.message; }
  }
  return "⚠️ Gemini'ye ulaşılamadı. Hata: " + lastError;
}

// --- GÖNDERME İŞLEMİ ---
async function send(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  
  addMsg(text, "user");
  input.value = "";

  const ruleReply = getRuleReply(text);

  if(getKey()){
    const typing = addMsg("...", "bot", false);
    typing.classList.add("typing");
    const reply = await getGeminiReply(text);
    typing.remove();
    
    if(reply) {
      addMsg(reply, "bot");
      // Sesli okuma (TTS) kaldırıldı
    } else {
      addMsg(ruleReply || "Bunu bilmiyorum 🤔", "bot");
    }
  } else {
    setTimeout(() => {
      addMsg(ruleReply || "Ayarlar'dan anahtar girersen daha akıllı olurum!", "bot");
    }, 250);
  }
}

document.getElementById("chatInput").addEventListener("keydown", e => { if(e.key === "Enter") send(); });

// --- ÖNERİ & OYUN ---
const suggestionData = {
  "kahve": ["Türk kahvesi", "Filtre kahve", "Latte", "Espresso"],
  "spor": ["Futbol", "Basketbol", "Koşu", "Yüzme"],
  "müzik": ["Rock", "Pop", "Jazz", "Klasik"],
  "film": ["Aksiyon", "Komedi", "Bilim kurgu"],
  "yemek": ["Pizza", "Mantı", "Kebap"],
  "oyun": ["Satranç", "Bulmaca", "Strateji"]
};
function suggest(){
  const q = document.getElementById("suggestInput").value.toLowerCase().trim();
  const list = document.getElementById("suggestList");
  list.innerHTML = ""; if(!q) return;
  let found = [];
  for(const [key, values] of Object.entries(suggestionData)){
    if(key.includes(q) || q.includes(key)) found.push({ title: key, items: values });
  }
  if(found.length === 0) return list.innerHTML = `<li>😕 "<b>${q}</b>" için öneri yok.</li>`;
  found.forEach(f => { const li = document.createElement("li"); li.innerHTML = `<strong>${f.title}</strong> → ${f.items.join(", ")}`; list.appendChild(li); });
}

let score = { user: 0, bot: 0, draw: 0 };
function play(userChoice){
  const choices = ["taş", "kağıt", "makas"];
  const botChoice = choices[Math.floor(Math.random() * 3)];
  const emoji = { "taş": "✊", "kağıt": "✋", "makas": "✌️" };
  let result = "", cls = "";
  if(userChoice === botChoice){ result = `Berabere! İkiniz de ${emoji[userChoice]} seçtiniz.`; cls = "draw"; score.draw++; }
  else if((userChoice==="taş"&&botChoice==="makas")||(userChoice==="kağıt"&&botChoice==="taş")||(userChoice==="makas"&&botChoice==="kağıt")){
    result = `Kazandın! 🎉 Sen ${emoji[userChoice]}, bot ${emoji[botChoice]}.`; cls = "win"; score.user++;
  } else { result = `Kaybettin 😢 Sen ${emoji[userChoice]}, bot ${emoji[botChoice]}.`; cls = "lose"; score.bot++; }
  const res = document.getElementById("gameResult");
  res.textContent = result; res.className = "result " + cls;
  document.getElementById("scoreUser").textContent = score.user;
  document.getElementById("scoreBot").textContent = score.bot;
  document.getElementById("scoreDraw").textContent = score.draw;
}

// --- BAŞLAT ---
updateApiStatus();
loadChat();
</script>
</body>
 </html>
